<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: installed on a phone, the app reaches under the notch and pads itself (safe-area insets). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Write chord sheets: lyrics with each chord on the syllable where it changes." />
    <meta name="theme-color" content="#161313" />
    <title>Groovekeeper</title>
    <script>
      // The chosen theme, applied before the page is drawn so it doesn't flash the default first (src/themes.ts).
      try {
        const theme = localStorage.getItem('groovekeeper.theme');
        if (theme) document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
